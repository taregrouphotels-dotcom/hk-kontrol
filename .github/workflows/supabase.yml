# main'e gelen her veritabanı değişikliğini Supabase'e uygular (önce testler geçmeli).
# Gerekli: GitHub → Settings → Secrets and variables → Actions → New repository secret
#   SUPBASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
name: Supabase güncelle

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/apply_migrations.sh'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-guncelle
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  guncelle:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPBASE_ACCESS_TOKEN }}   # GitHub'daki secret adı böyle (A harfi eksik)
      SUPABASE_PROJECT_REF: ihwyfllcvkcpjsouhsel   # gizli değil; proje adresindeki kimlik
    steps:
      - name: Ayar kontrolü
        id: ayar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPBASE_ACCESS_TOKEN secret'ı tanımlı değil; Supabase güncellemesi atlandı."
            echo "var=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "var=evet" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ayar.outputs.var == 'evet'
      - name: Migration'lar
        if: steps.ayar.outputs.var == 'evet'
        run: scripts/apply_migrations.sh
