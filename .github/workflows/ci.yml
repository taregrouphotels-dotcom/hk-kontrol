# Her push ve PR'da: migration'lar boş Postgres'e kurulur, yetki (RLS) testleri çalışır;
# arayüz ve Edge Function'lar tip kontrolünden geçer, arayüz derlenir.
name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  veritabani:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migration'lar ve RLS testleri
        run: test/veritabani_test.sh

  arayuz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketler
        run: npm install --no-audit --no-fund
      - name: Tip kontrolü ve derleme
        run: npm run build
      - name: Excel ayrıştırma testi
        run: node test/excel_import_test.mjs

  fonksiyonlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
      - name: Edge Function tip kontrolü
        # Her fonksiyon kendi deno.json'uyla (arayüzün node_modules'ına bakmasın)
        run: for d in supabase/functions/*/; do deno check --config "$d/deno.json" "$d/index.ts"; done
